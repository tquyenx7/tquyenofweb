<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tquyen profile</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
        color: white;
        background-color: rgb(30, 28, 66);
      }
      /* 1 avatar */
      .avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        border: 1px solid;
        object-fit: cover;
        display: block;
        margin: 0 auto;
      }
      /* 2 profile-card */
      .profile-card {
        width: 370px;
        max-width: 90%;
        border-radius: 20px;
        background-color: rgb(124, 195, 195);
        padding: 24px;
        /* box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.3); */
        box-shadow: 3px 3px 10px;
      }
      /* text */
      h1 {
        margin: 10px 0 16px;
        font-size: 24px;
        line-height: 0.5;
        padding-top: 20px;
        text-align: center;
      }
      h3 {
        text-align: center;
        height: max-content;
        line-height: 0;
      }
      p {
        text-align: center;
      }
      .hobbies {
        font-size: 18px;
        margin: 14px 0 20px;
      }
      .hobbies a {
        text-decoration: none;
        color: white;
      }
      .description {
        text-align: 1.4;
        padding-top: 10px;
      }
      .social-button {
        display: flex;
        gap: 12px;
      }
      .social-button a {
        flex: 1;
        min-width: 0;
        padding: 12px 4px;
        text-decoration: none;
        text-shadow: 1 0 0 currentColor;
        color: white;
        font-style: sans-serif;
        background-color: #d54f4f;
        border-radius: 10px;
        text-align: center;
        font-size: 18px;
        font-weight: bold;
        transition: 0.4s;
      }
      .social-button a:hover {
        background-color: rgb(64, 99, 130);
      }
    </style>
  </head>
  <body>
    <div class="profile-card">
      <a href="./index2.html"><img src="./img/tquyen.jpg" class="avatar" /></a>
      <h1>Đặng Trọng Quyền</h1>
      <h3>(邓重权)</h3>
      <p class="description">
        Hello everyone ! I am tquyenx7.I like study english
      </p>
      <p class="hobbies">
        🎮 Chơi game · <a href="./tquyenofcover.html">🎵Nghe nhạc ·</a> 💻 Lập
        trình
      </p>
      <div class="social-button">
        <a
          href="https://www.facebook.com/share/1EcqUTVa4V/?mibextid=wwXIfr"
          target="_blank"
          >Facebook</a
        >
        <a
          href="https://www.tiktok.com/@.12th123?_r=1&_t=ZS-9AiDSYHQwAq"
          target="_blank"
          >tiktok</a
        >
        <!-- <a href="" target="_blank"></a> -->
      </div>
    </div>
  </body>
</html>
